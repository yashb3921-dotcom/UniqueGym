<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unique Gym – App Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;background:radial-gradient(circle at 15% 10%,#2a2f6b,#0b1020 60%);min-height:100vh;display:flex;align-items:center;justify-content:center;gap:56px;flex-wrap:wrap;padding:20px;color:#0f172a;--ac:#4f46e5;--ac2:#7c3aed;--soft:#eef0ff}
body.trainer{--ac:#ea580c;--ac2:#f59e0b;--soft:#fff1e6}
body.member{--ac:#0d9488;--ac2:#0ea5e9;--soft:#e0f7f4}
.side{color:#fff;max-width:300px}
.side h1{font-size:34px;font-weight:800;line-height:1.1}
.side p{color:#aab3d6;margin:10px 0 22px;font-size:14px;line-height:1.5}
.roles button{display:block;width:100%;text-align:left;margin-bottom:10px;padding:14px 16px;border-radius:16px;border:1px solid #ffffff22;background:#ffffff0d;color:#fff;font:inherit;cursor:pointer}
.roles button b{display:block;font-size:15px}.roles button span{font-size:12px;color:#aab3d6}
.roles button.on{background:#fff;color:#0f172a}.roles button.on span{color:#64748b}
.phone{width:390px;height:810px;max-height:95vh;border-radius:46px;border:11px solid #05070f;background:#f1f3f9;position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 40px 90px #000a}
.sb{display:flex;justify-content:space-between;padding:12px 26px 4px;font-size:12px;font-weight:700}
#scr{flex:1;overflow-y:auto;padding:8px 18px 18px;scrollbar-width:none}#scr::-webkit-scrollbar{display:none}
nav{display:flex;background:#fff;padding:8px 6px 16px;border-top:1px solid #e5e9f2}
nav button{flex:1;border:0;background:none;font:inherit;font-size:11px;font-weight:600;color:#94a3b8;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:20px;filter:grayscale(1);opacity:.6}
nav button.on{color:var(--ac)}nav button.on i{filter:none;opacity:1}
.hd{display:flex;justify-content:space-between;align-items:center;margin:8px 0 16px}
.hd small{color:#64748b;font-size:12px}.hd h2{font-size:22px;font-weight:800}
.av{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
h3{font-size:15px;font-weight:800;margin:20px 0 10px;display:flex;justify-content:space-between;align-items:center}
h3 a{font-size:12px;color:var(--ac);font-weight:600}
.card{background:#fff;border-radius:20px;padding:14px;margin-bottom:10px;box-shadow:0 2px 10px #1e293b0d}
.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:26px;padding:18px;position:relative;overflow:hidden;margin-bottom:12px}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:#ffffff1f}
.hero small{opacity:.85;font-size:12px}.hero .big{font-size:32px;font-weight:800;margin:2px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{grid-template-columns:repeat(3,1fr)}
.kpi{background:#fff;border-radius:18px;padding:12px;box-shadow:0 2px 10px #1e293b0d}
.kpi small{color:#64748b;font-size:11px}.kpi b{display:block;font-size:20px;font-weight:800;margin-top:2px}.kpi em{font-style:normal;font-size:11px;color:#16a34a;font-weight:700}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #eef1f6}.row:last-child{border:0}
.row .t{flex:1;min-width:0}.row .t b{font-size:14px;display:block}.row .t small{color:#64748b;font-size:12px}
.chip{font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;white-space:nowrap}
.ok{background:#dcfce7;color:#15803d}.wa{background:#fef3c7;color:#b45309}.er{background:#fee2e2;color:#dc2626}.in{background:var(--soft);color:var(--ac)}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:10px}
.b{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:10px;color:#64748b}
.b i{width:100%;border-radius:8px 8px 4px 4px;background:var(--soft);display:block}.b i.hi{background:linear-gradient(var(--ac),var(--ac2))}
.dn{width:104px;height:104px;flex:none}.leg{font-size:12px;flex:1}.leg div{display:flex;align-items:center;gap:7px;margin:5px 0}.leg u{width:10px;height:10px;border-radius:3px}.leg span{margin-left:auto;font-weight:700}
.ln{width:100%;height:100px;margin-top:8px}
.btn{border:0;border-radius:14px;padding:11px 16px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;background:var(--ac);color:#fff}
.btn.sm{padding:7px 12px;font-size:12px;border-radius:10px}.btn.gh{background:var(--soft);color:var(--ac)}.btn.rd{background:#fee2e2;color:#dc2626}.btn.w{width:100%;padding:14px}.btn.wh{background:#fff;color:var(--ac)}
.pg{height:8px;background:#e5e9f2;border-radius:9px;overflow:hidden;margin-top:6px}.pg i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:9px}
.search{width:100%;padding:13px 16px;border-radius:16px;border:0;background:#fff;font:inherit;margin-bottom:10px;box-shadow:0 2px 10px #1e293b0d;outline:none}
.pills{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}.pills button{border:0;background:#fff;border-radius:99px;padding:8px 14px;font:inherit;font-size:12px;font-weight:700;color:#64748b;white-space:nowrap;cursor:pointer}.pills button.on{background:var(--ac);color:#fff}
.rg{position:relative;width:84px;height:84px;flex:none}.rg svg{width:100%}.rg b{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;font-weight:800;padding-bottom:10px}.rg small{position:absolute;left:0;right:0;bottom:21px;text-align:center;font-size:9px;color:#64748b}
.qr{display:grid;grid-template-columns:repeat(11,1fr);width:86px;height:86px;background:#fff;padding:6px;border-radius:12px}.qr u{display:block}.qr u.k{background:#0f172a;border-radius:1px}
.ex{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #eef1f6;cursor:pointer}.ex:last-child{border:0}
.ck{width:26px;height:26px;border-radius:9px;border:2px solid #cbd5e1;display:grid;place-items:center;color:#fff;font-size:14px;flex:none}.ex.d .ck{background:var(--ac);border-color:var(--ac)}.ex.d b{text-decoration:line-through;color:#94a3b8}
.ex .t{flex:1}.ex b{font-size:14px;display:block}.ex small{font-size:12px;color:#64748b}
.plan{border:2px solid #e5e9f2;background:#fff;border-radius:18px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.plan.on{border-color:var(--ac);background:var(--soft)}.plan b{font-size:15px;display:block}.plan small{color:#64748b;font-size:12px}.plan strong{font-size:18px;font-weight:800}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:28px 28px 0 0;padding:20px;box-shadow:0 -20px 60px #0006;z-index:5;animation:up .25s}.shade{position:absolute;inset:0;background:#0008;z-index:4}
@keyframes up{from{transform:translateY(100%)}}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.apps div{text-align:center;font-size:11px;font-weight:600;cursor:pointer}.apps i{display:grid;place-items:center;height:52px;border-radius:16px;font-style:normal;font-size:24px;margin-bottom:4px;background:#f1f3f9}
#toast{position:absolute;left:50%;top:60px;transform:translate(-50%,-120px);background:#0f172a;color:#fff;padding:11px 18px;border-radius:14px;font-size:13px;font-weight:600;z-index:9;transition:.3s;white-space:nowrap}#toast.s{transform:translate(-50%,0)}
.banner{background:#0f172a;color:#fff;border-radius:18px;padding:14px;font-size:13px;display:flex;gap:10px;align-items:center;margin-bottom:10px}
@media(max-width:480px){body{padding:0;gap:0;display:block;background:#0b1020}.side p,.side h1{display:none}.side{padding:10px;max-width:none}.roles{display:flex;gap:6px}.roles button{margin:0;padding:8px;text-align:center}.roles button span{display:none}.phone{width:100%;height:calc(100vh - 62px);max-height:none;border:0;border-radius:0}}
</style></head><body>
<div class="side"><h1>Unique Gym<br>Mobile App</h1><p>One app for the owner, trainers and members. Pick a role to see its dashboard. Buttons inside the phone really work.</p>

<script>

const S={role:'admin',tab:0,done:{},cin:false,book:{},plan:1,q:'',f:'All',pay:'none',pend:[
['Rohan Patil','Monthly',1500,'4182 7731 0921','PhonePe'],['Anjali Gaikwad','Monthly',1500,'4182 9902 1177','GPay'],['Neha Pawar','Quarterly',3900,'4183 0045 8820','Paytm'],['Kunal Mehta','Yearly',11500,'4183 5521 7064','GPay']]};

const PL=[['Monthly','30 days',1500],['Quarterly','90 days · save 13%',3900],['Half-Yearly','180 days · save 24%',6800],['Yearly','365 days · save 36% + 2 PT sessions',11500]];
const av=(n,i)=>`<div class="av" style="background:hsl(${i*47+210} 65% 50%)">${n.split(' ').map(x=>x[0]).join('')}</div>`;
const chip=s=>`<span class="chip ${s=='Active'?'ok':s=='Expired'?'er':'wa'}">${s}</span>`;
const hd=(sub,t,n)=>`<div class="hd"><div><small>${sub}</small><h2>${t}</h2></div>${av(n,S.role=='admin'?1:S.role=='trainer'?3:5)}</div>`;
const kpi=(l,v,d)=>`<div class="kpi"><small>${l}</small><b>${v}</b><em>${d}</em></div>`;
const bars=(v,l,h)=>{const m=Math.max(...v);return `<div class="bars">${v.map((x,i)=>`<div class="b"><i style="height:${x/m*85}%" class="${i==h?'hi':''}"></i>${l[i]}</div>`).join('')}</div>`};
const line=v=>{const mn=Math.min(...v)-1,mx=Math.max(...v)+1,p=v.map((y,i)=>[i*300/(v.length-1),95-(y-mn)/(mx-mn)*85]),d=p.map((q,i)=>(i?'L':'M')+q[0].toFixed(0)+' '+q[1].toFixed(0)).join('');return `<svg viewBox="0 0 300 100" class="ln"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ac);stop-opacity:.3"/><stop offset="1" style="stop-color:var(--ac);stop-opacity:0"/></linearGradient></defs><path d="${d}L300 100L0 100Z" fill="url(#g)"/><path d="${d}" fill="none" style="stroke:var(--ac)" stroke-width="3" stroke-linecap="round"/>${p.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="#fff" style="stroke:var(--ac)" stroke-width="2.5"/>`).join('')}</svg>`};
const donut=(v,c)=>{let o=0;const t=v.reduce((a,b)=>a+b);return `<svg viewBox="0 0 100 100" class="dn">${v.map((x,i)=>{const l=x/t*251.3,s=`<circle cx="50" cy="50" r="40" fill="none" stroke="${c[i]}" stroke-width="15" stroke-dasharray="${l-2} 251.3" stroke-dashoffset="${-o}" transform="rotate(-90 50 50)"/>`;o+=l;return s}).join('')}</svg>`};
const ring=(p,t,s)=>`<div class="rg"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="34" fill="none" stroke="#e5e9f2" stroke-width="9"/><circle cx="40" cy="40" r="34" fill="none" style="stroke:var(--ac)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${p*2.136} 214" transform="rotate(-90 40 40)"/></svg><b>${t}</b><small>${s}</small></div>`;
const qr=()=>{let s='';for(let i=0;i<121;i++){const r=i/11|0,c=i%11;s+=`<u class="${(r<3&&c<3)||(r<3&&c>7)||(r>7&&c<3)||(i*7+r*3)%5<2?'k':''}"></u>`}return `<div class="qr">${s}</div>`};
const mrows=l=>l.map(m=>`<div class="row">${av(m[0],M.indexOf(m))}<div class="t"><b>${m[0]}</b><small>${m[1]} · ${m[3]<0?'expired '+-m[3]+' days ago':m[3]+' days left'}</small></div>${chip(m[2])}</div>`).join('');
const T={
admin:{tabs:[['Home','🏠'],['Members','👥'],['Payments','💳'],['Manage','⚙️']],s:[
()=>hd('Good morning, Owner','Unique Gym','Gym Owner')+`<div class="hero"><small>Revenue this month</small><div class="big">₹14.2 L</div><small>▲ 8.4% vs last month · target ₹15 L</small><div class="pg" style="background:#fff3"><i style="width:94%;background:#fff"></i></div></div>
<div class="grid">${kpi('Total members','1,000','+38 this month')}${kpi('Active now','842','84% active')}${kpi('Check-ins today','312','▲ 12% vs avg')}${kpi('Pending payments',S.pend.length,'needs approval')}</div>
<h3>Revenue, last 6 months<a>₹ lakh</a></h3><div class="card">${bars([9.8,10.6,11.2,12.4,13.1,14.2],['Apr','May','Jun','Jul','Aug','Sep'],5)}</div>
<h3>Plan mix</h3><div class="card" style="display:flex;gap:14px;align-items:center">${donut([28,34,22,16],['#4f46e5','#7c3aed','#06b6d4','#f59e0b'])}<div class="leg"><div><u style="background:#4f46e5"></u>Monthly<span>28%</span></div><div><u style="background:#7c3aed"></u>Quarterly<span>34%</span></div><div><u style="background:#06b6d4"></u>Half-yearly<span>22%</span></div><div><u style="background:#f59e0b"></u>Yearly<span>16%</span></div></div></div>
<h3>Busy hours today</h3><div class="card">${bars([30,85,60,25,20,35,70,95,55],['6a','8a','10a','12p','2p','4p','6p','7p','9p'],7)}<small style="color:#64748b;font-size:12px">Peak time is 7 PM. Plan trainer shifts around it.</small></div>
<h3>Expiring this week<a>Remind all</a></h3><div class="card">${mrows(M.filter(m=>m[2]=='Expiring'))}</div>`,
()=>hd('1,000 members','Members','Gym Owner')+`<input class="search" placeholder="🔍 Search name or phone" value="${S.q}" oninput="S.q=this.value;list()"><div class="pills">${['All','Active','Expiring','Expired'].map(f=>`<button class="${S.f==f?'on':''}" onclick="S.f='${f}';render()">${f}</button>`).join('')}</div><div class="card" id="ml"></div><button class="btn w" onclick="toast('Add member form opens here')">+ Add new member</button>`,
()=>hd('UPI direct to gym account','Payments','Gym Owner')+`<div class="grid">${kpi('Collected today','₹38,500','24 payments')}${kpi('Waiting',inr(S.pend.reduce((a,p)=>a+p[2],0)),S.pend.length+' to check')}</div><h3>Pending approval</h3>`+(S.pend.length?S.pend.map((p,i)=>`<div class="card"><div style="display:flex;justify-content:space-between"><b>${p[0]}</b><b>${inr(p[2])}</b></div><small style="color:#64748b;font-size:12px">${p[1]} plan · via ${p[4]}<br>UTR ${p[3]}</small><div style="display:flex;gap:8px;margin-top:10px"><button class="btn sm" onclick="appr(${i},1)">Approve</button><button class="btn sm rd" onclick="appr(${i},0)">Reject</button></div></div>`).join(''):`<div class="card" style="text-align:center;color:#64748b">🎉 All payments checked</div>`)+`<h3>Recently approved</h3><div class="card"><div class="row"><div class="t"><b>Sneha Joshi</b><small>Half-Yearly · 9:12 AM</small></div><b>₹6,800</b></div><div class="row"><div class="t"><b>Vikram More</b><small>Yearly · 8:40 AM</small></div><b>₹11,500</b></div></div>`,
()=>hd('Staff and tools','Manage','Gym Owner')+`<h3 style="margin-top:0">Trainers</h3>`+[['Rohit Kulkarni','Strength · 32 clients','4.9'],['Sneha Pawar','Yoga & Zumba · 41 clients','4.8'],['Imran Khan','Weight loss · 27 clients','4.7']].map((t,i)=>`<div class="card"><div class="row" style="border:0;padding:0">${av(t[0],i+2)}<div class="t"><b>${t[0]}</b><small>${t[1]}</small></div><span class="chip in">⭐ ${t[2]}</span></div></div>`).join('')+`<h3>Quick actions</h3><div class="grid">${[['📢','Send announcement'],['🎟️','Create offer'],['📊','Download report'],['🔔','Expiry reminders']].map(a=>`<div class="kpi" style="cursor:pointer" onclick="toast('${a[1]} sent ✓')"><span style="font-size:24px">${a[0]}</span><b style="font-size:13px">${a[1]}</b></div>`).join('')}</div>`]},

function list(){$('#ml').innerHTML=mrows(M.filter(m=>(S.f=='All'||m[2]==S.f)&&m[0].toLowerCase().includes(S.q.toLowerCase())))||'<small>No members found</small>'}
function go(i){S.tab=i;$('#scr').scrollTop=0;render()}
function toast(m){const t=$('#toast');t.textContent=m;t.className='s';clearTimeout(t.h);t.h=setTimeout(()=>t.className='',1800)}
function appr(i,ok){const p=S.pend.splice(i,1)[0];toast(ok?p[0]+' activated ✓':'Payment rejected');render()}
function tg(i){S.done[i]?delete S.done[i]:S.done[i]=1;if(Object.keys(S.done).length==5)toast('Workout complete! 🎉');render()}
function sheet(){$('#ov').innerHTML=`<div class="shade" onclick="$('#ov').innerHTML=''"></div><div class="sheet"><b style="font-size:17px">Pay ${inr(PL[S.plan][2])}</b><br><small style="color:#64748b">To uniquegym@okicici · ${PL[S.plan][0]} plan</small><div class="apps">${[['🟦','GPay'],['🟪','PhonePe'],['🟦','Paytm'],['🏦','BHIM']].map(a=>`<div onclick="done()"><i>${a[0]}</i>${a[1]}</div>`).join('')}</div><small style="color:#64748b">Your UPI app opens. After paying, we confirm with the gym.</small></div>`}
function done(){$('#ov').innerHTML='';S.pay='wait';toast('Opening UPI app… payment sent');render()}
